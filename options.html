<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Settings</title>
  </head>
  <body style="font-family: sans-serif; max-width: 400px; margin: 30px auto">
    <h2>LeetCode → GitHub</h2>

    <label>GitHub token</label><br />
    <input id="token" type="password" style="width: 100%" /><br /><br />

    <label>GitHub username</label><br />
    <input id="owner" style="width: 100%" /><br /><br />

    <label>Repository</label><br />
    <input id="repo" style="width: 100%" /><br /><br />

    <button id="save">Save</button>
    <span id="status"></span>

    <script src="options.js"></script>
  </body>
</html>
