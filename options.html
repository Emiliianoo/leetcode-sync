<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Settings</title>
  </head>
  <body style="font-family: sans-serif; max-width: 400px; margin: 30px auto">
    <h2>LeetCode → GitHub</h2>

    <label>GitHub token</label><br />
    <input id="token" type="password" style="width: 100%" /><br />
    <small style="color: #666">
      Use a
      <a href="https://github.com/settings/personal-access-tokens/new" target="_blank">fine-grained token</a>
      with access to only this repository and the permission
      <b>Contents: Read and write</b>.
    </small><br /><br />

    <label>GitHub username</label><br />
    <input id="owner" style="width: 100%" /><br /><br />

    <label>Repository</label><br />
    <input id="repo" style="width: 100%" /><br /><br />

    <button id="save">Save</button>
    <span id="status"></span>

    <script src="options.js"></script>
  </body>
</html>
